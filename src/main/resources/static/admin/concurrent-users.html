<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>동시접속자 - 운영툴</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1c1e26; color: #eee; margin: 0; }
        main { padding: 40px; max-width: 900px; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #262936; color: #eee; }
        .chart-box { background: #262936; border-radius: 8px; padding: 16px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="adminNav"></div>
    <main>
        <h1>시간대별 동시접속자</h1>
        <select id="rangeSelect">
            <option value="24">최근 24시간</option>
            <option value="168">최근 7일</option>
        </select>
        <div class="chart-box">
            <canvas id="concurrentChart" height="90"></canvas>
        </div>
    </main>
    <script src="/admin/js/admin-common.js"></script>
    <script>
        renderAdminNav('concurrent');

        let chart = null;

        async function loadChart(rangeHours) {
            const response = await adminFetch(`/admin/api/concurrent-users?rangeHours=${rangeHours}`);
            const points = await response.json();

            const labels = points.map((p) => new Date(p.snapshotAt).toLocaleString());
            const counts = points.map((p) => p.onlineCount);

            if (chart !== null) chart.destroy();
            chart = new Chart(document.getElementById('concurrentChart'), {
                type: 'line',
                data: { labels, datasets: [{ label: '동시접속자 수', data: counts, borderColor: '#4a7dff', tension: 0.2 }] },
                options: { scales: { y: { beginAtZero: true } } },
            });
        }

        document.getElementById('rangeSelect').addEventListener('change', (e) => loadChart(e.target.value));
        loadChart(24);
    </script>
</body>
</html>
