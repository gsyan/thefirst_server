# Development Environment (Local PC)
# ================================
# Profile: DEV (Local Development)
# Database: Local MariaDB (127.0.0.1:3306)
# ================================

# Windows(winnat)는 동적 포트 범위 안에서 포트를 예약해 바인딩을 막으므로, dev는 동적 범위(현재 1024~15000, 기본값 49152~) 밖의 포트를 씀
# prod는 application-prod.properties/docker-compose의 8080/8081 사용
server.port=18888
admin.server.port=18889

# mysql -------------------------------------------------------------------------------------------------------
