#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MariaDB - Local
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:3306/GameDB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# H2 http://127.0.0.1:8080/h2-console --------------------------------------------------------------------------
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.url=jdbc:h2:mem:test
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true

# JPA
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate

# Flyway - schema changes go in new db/migration/V2, V3, ... files only. Never edit/delete applied migrations (incl. V1) and never reset the DB.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# 테스트 계정(guest_test0001~)에 서로 다른 빌드를 서버 기동마다 덮어씀 — TestAccountProfileApplier (dev 전용)
test.data.profile.enabled=true

# 로컬 검증 전용 — 환경변수 DEV_IMPERSONATE_COMMANDER_ID에 커맨더 id를 주면 어떤 계정으로 로그인해도 그 커맨더의 계정으로 접속(AccountService.resolveDevImpersonation)
dev.impersonate-commander-id=${DEV_IMPERSONATE_COMMANDER_ID:0}

# Logging
logging.level.com.bk.sbs=DEBUG

# Startup Banner - DB 정보 표시
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=TRACE
