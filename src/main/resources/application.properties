spring.application.name=sbs

server.status.working=true
server.status.endTime=2026-07-03T15:00:00Z

# Active Profile (dev or prod)
# IntelliJ Run Configuration\uC5D0\uC11C override \uAC00\uB2A5
spring.profiles.active=dev

# This is the default port anyway, but you can change it here
server.port=8080

# max size for file
#spring.servlet.multipart.maxFileSize=20MB
# max size per request
#spring.servlet.multipart.maxRequestSize=100MB
# resource upload path
#uploadPath=file:///C:/bk/springboot/sbs_path
# ItemImg upload path
#itemImgLocation=C:/bk/springboot/sbs_path/item


# Database\uC640 JPA \uC124\uC815\uC740 application-dev.properties\uC640 application-prod.properties\uC5D0\uC11C \uAD00\uB9AC
# (\uD504\uB85C\uD30C\uC77C\uBCC4\uB85C \uB2E4\uB978 DB \uC5F0\uACB0 \uC815\uBCF4 \uC0AC\uC6A9)

# JPA Common Settings (\uD504\uB85C\uD30C\uC77C \uACF5\uD1B5)
# default batch size
spring.jpa.properties.hibernate.default_batch_fetch_size=1000
# add comment in sql for easier debugging
spring.jpa.properties.hibernate.use_sql_comments=true
# confirm binding value of sql ?
logging.level.org.hibernate.type.descriptor.sql=trace

# Live Reload
#spring.devtools.livereload.enabled=true

worldId=1

# App Config Initial Values -------------------------------------------------------------------------
app.init.android-min-version-code=196
app.init.android-min-version-name=0.1.33

# Heartbeat Settings -------------------------------------------------------------------------
# lastOnlineAt \uAC31\uC2E0 \uC2A4\uB85C\uD2C0 (\uCD08 \uB2E8\uC704, \uAE30\uBCF8 30s)
heartbeat.throttle-seconds=30
# \uC571 \uBCF5\uADC0 \uD310\uB2E8 \uC784\uACC4\uAC12: \uB9C8\uC9C0\uB9C9 \uD558\uD2B8\uBE44\uD2B8\uC640 \uC774 \uAC12 \uC774\uC0C1 \uCC28\uC774\uB098\uBA74 \uAC15\uC81C \uC218\uD655 (\uCD08 \uB2E8\uC704, \uAE30\uBCF8 600s = 10\uBD84)
heartbeat.resume-threshold-seconds=60


# spring log
#logging.level.org.springframework.web=DEBUG

# Log file
logging.file.name=logs/app.log

# Jackson Settings --------------------------------------------------------------------------
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# JWT Settings -------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
# 1 hour
jwt.access-token-validity-in-seconds=3600
#jwt.access-token-validity-in-seconds=10
# 30 days
jwt.refresh-token-validity-in-seconds=2592000



# DB test data ----------------------------------------------------------------------------
# 0 = \uC0DD\uC131 \uC548 \uD568, N = N\uAC1C \uC0DD\uC131 (pvp/zone \uBD84\uD3EC \uBC94\uC704 \uCD08\uACFC \uC2DC \uC790\uB3D9 \uC870\uC815)
test.data.count=3
# pvp_record \uC810\uC218 \uBD84\uD3EC: base=\uC911\uAC04\uAC12, deviation=\uAC04\uACA9 (base, base-dev, base+dev, base-2*dev ...)
# \uCD5C\uB300 count = 2 * (base / deviation) + 1
test.data.pvp.enabled=true
test.data.pvp.base-score=1000
test.data.pvp.deviation=100
# cleared_zone \uBD84\uD3EC: base=\uAE30\uC900\uC874, deviation=\uC778\uB371\uC2A4 \uAC04\uACA9 (\uCC55\uD130*10+\uC2A4\uD14C\uC774\uC9C0 \uAE30\uC900)
# \uCD5C\uB300 count = 2 * min(\uAE30\uC900\uC778\uB371\uC2A4/dev, (89-\uAE30\uC900\uC778\uB371\uC2A4)/dev) + 1
test.data.zone.enabled=true
test.data.zone.base=5-5
test.data.zone.deviation=5


# Ranking Sync Settings ---------------------------------------------------------------------
# PVP \uB7AD\uD0B9 \uC7AC\uB3D9\uAE30\uD654 \uC8FC\uAE30 (\uBD84 \uB2E8\uC704, \uAE30\uBCF8 60\uBD84 = 1\uC2DC\uAC04)
ranking.pvp.sync.rate-minutes=60
# Zone \uB7AD\uD0B9 \uC7AC\uB3D9\uAE30\uD654 \uC8FC\uAE30 (\uBD84 \uB2E8\uC704, \uAE30\uBCF8 60\uBD84 = 1\uC2DC\uAC04)
ranking.zone.sync.rate-minutes=60

# Redis Settings ----------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Google OAuth Settings ----------------------------------------------------------------------
google.client-id=527468162306-m77vtlkevpa42hf41arcodjmcio5fs85.apps.googleusercontent.com
google.use-firebase-auth=false

# Google Play IAP Settings -------------------------------------------------------------------
# Google Play \uC571 \uD328\uD0A4\uC9C0\uBA85 (\uC2A4\uD1A0\uC5B4 \uB4F1\uB85D \uD328\uD0A4\uC9C0\uBA85\uACFC \uB3D9\uC77C\uD574\uC57C \uD568)
google.play.package-name=com.fidforge.thefirst
# VIP \uAD6C\uB3C5 \uC0C1\uD488 ID
google.play.vip-product-id=vip_month
# VIP \uC77C\uC77C \uBBF8\uB124\uB784 \uCD94\uAC00 \uC9C0\uAE09\uB7C9 (\uACF5\uD1B5 \uBCF4\uC0C1\uC5D0 \uD569\uC0B0)
vip.mineral-reward-multiplier=4

# Zone Settings -----------------------------------------------------------------------------
# false \uB85C \uC124\uC815 \uC2DC \uC774\uC804 \uC2A4\uD14C\uC774\uC9C0 \uD074\uB9AC\uC5B4 \uC5C6\uC774 \uC544\uBB34 \uC2A4\uD14C\uC774\uC9C0\uB098 \uC9C4\uC785 \uAC00\uB2A5
zone.require-previous-stage-cleared=true

# Test Settings -------------------------------------------------------------------------
# true \uC2DC \uAC8C\uC2A4\uD2B8 \uB85C\uADF8\uC544\uC6C3(\uACC4\uC815 \uC0AD\uC81C \uC694\uCCAD)\uC5D0\uC11C \uC2E4\uC81C \uB370\uC774\uD130\uB97C \uC0AD\uC81C\uD558\uC9C0 \uC54A\uC74C \u2014 \uD14C\uC2A4\uD2B8 \uACC4\uC815 \uC5EC\uB7EC \uAC1C \uC313\uC544\uB450\uAE30\uC6A9
test.guest-keep-data-on-logout=false